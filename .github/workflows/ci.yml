name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nuam-kasse/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nuam-kasse/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Syntax check
        run: python -m compileall -q app tests
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nuam-kasse/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nuam-kasse/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate development Compose file
        working-directory: nuam-kasse
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - name: Validate VPS Compose template
        working-directory: nuam-kasse
        run: |
          sed \
            -e 's|__DEPLOY_COMMIT__|0000000000000000000000000000000000000000|g' \
            -e 's|__RELEASE_DIR__|/tmp/nuamkasse-release/nuam-kasse|g' \
            ops/docker-compose.vps.yml > /tmp/nuamkasse-compose.yml
          docker compose --env-file .env.ip.example -p nuamkasse-ip -f /tmp/nuamkasse-compose.yml config --quiet
